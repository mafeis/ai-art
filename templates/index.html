<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Forge | 水浒像素工坊</title>
    <style>
        :root {
            /* Minimalist Palette - Ink & Paper */
            --bg-color: #f8f9fa;
            --surface: #ffffff;
            --surface-translucent: rgba(255, 255, 255, 0.8);
            
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            
            --accent: #2d3436; /* Ink Black */
            --accent-hover: #000000;
            --accent-light: #e0e0e0;
            
            --border: #eeeeee;
            --border-hover: #d0d0d0;
            
            --success: #10b981;
            --error: #ef4444;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 24px;
            
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Reset & Base */
        * { box-sizing: border-box; outline: none; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            gap: 0;
        }

        /* Sidebar (Controls) */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #eee; border-radius: 3px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #ddd; }

        .logo-area {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-badge {
            font-size: 0.7rem;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Main Stage (Preview) */
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 1px 1px, #e5e5e5 1px, transparent 0);
            background-size: 40px 40px;
            background-color: #fafafa;
            padding: 20px;
            overflow: hidden; 
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 Columns */
            gap: 8px; 
            width: 100%;
            /* Make it wider to fit 4 columns comfortably */
            max-width: 100%; 
        }

        .preview-card-item {
            background: var(--surface);
            padding: 6px;
            border-radius: var(--radius-sm); /* Slightly smaller radius */
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        
        .preview-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem; /* Smaller text */
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0 2px;
        }

        .pixel-canvas-small {
            width: 100%;
            aspect-ratio: 1;
            background-color: #e6e6e6;
            border-radius: 4px;
            image-rendering: pixelated;
            object-fit: contain;
            transition: background-color 0.3s ease;
        }

        .mini-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
        }
        
        .mini-btn:hover {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        /* Controls Components */
        .control-section {
            margin-bottom: 32px;
        }

        .section-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .control-grid.full { grid-template-columns: 1fr; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Modern Select */
        .select-wrapper {
            position: relative;
        }
        
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.9rem;
            color: var(--text-primary);
            background: var(--bg-color);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            appearance: none;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        
        select:hover {
            background: #eaeaea;
        }
        
        select:focus {
            background: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
        }

        .select-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            width: 10px;
            height: 10px;
            fill: var(--text-secondary);
        }

        /* Segmented Control (Pills) */
        .segmented-control {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: var(--radius-sm);
            gap: 2px;
        }
        
        .segment-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        
        .segment-btn.active {
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }

        /* Color Palette */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        
        .color-swatch:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }

        .color-swatch input[type="color"] {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            opacity: 0;
            cursor: pointer;
        }

        .swatch-label {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 4px;
            color: var(--text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Primary Action Button */
        .action-bar {
            position: sticky;
            bottom: -32px; /* stick to bottom padding */
            background: var(--surface);
            padding-top: 20px;
            margin-top: auto;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            background: var(--accent-hover);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }

        /* Overlay / Floating UI */
        .floating-tools {
            margin-top: 10px;
            display: flex;
            gap: 16px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tool-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-primary);
        }
        
        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Status & Toast */
        .status-toast {
            position: absolute;
            top: 40px;
            background: var(--surface);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-20px);
            transition: var(--transition);
            pointer-events: none;
            z-index: 100;
        }
        
        .status-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; height: auto; }
            .sidebar { height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .stage { height: 600px; padding: 40px; }
            .action-bar { position: static; }
        }
        
        /* Loading Animation */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- LEFT SIDEBAR: CONTROLS -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-text-group">
                    <h1 class="logo-title">
                        水浒工坊 
                        <span class="logo-badge">Pro</span>
                    </h1>
                    <p style="font-size: 0.85rem; color: var(--text-tertiary); margin-top: 5px;">
                        高清像素角色生成器 v2.1
                    </p>
                </div>
            </div>

            <!-- Global Settings -->
            <div class="control-section">
                <div class="section-header">
                    <span>风格与主题</span>
                    <button class="tool-btn" onclick="randomizeAll()" title="全局随机">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    </button>
                </div>
                <div class="control-grid full">
                    <div class="select-wrapper">
                        <select id="theme-select">
                            <option value="all">🎲 混合风格</option>
                            <option value="fantasy">🏰 奇幻冒险</option>
                            <option value="scifi">🦾 赛博科幻</option>
                            <option value="modern">🏙️ 现代都市</option>
                            <option value="cute">🌸 Q版萌系</option>
                            <option value="action">⚔️ 战斗动作</option>
                        </select>
                        <svg class="select-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Render Settings (Hidden as per requirement) -->
            <div class="control-section" style="display: none;">
                <div class="section-header">
                    <span>画质设置</span>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <div class="label" style="margin-bottom: 8px;">输出尺寸 (像素)</div>
                    <div class="segmented-control" id="size-control">
                        <button class="segment-btn" data-value="64">64</button>
                        <button class="segment-btn" data-value="128">128</button>
                        <button class="segment-btn" data-value="256">256</button>
                        <button class="segment-btn active" data-value="512">512</button>
                    </div>
                    <!-- 默认设为 512 -->
                    <input type="hidden" id="output-size-select" value="512">
                </div>

                <div style="margin-bottom: 15px;">
                    <div class="label" style="margin-bottom: 8px;">像素密度 (精细度)</div>
                    <div class="segmented-control" id="density-control">
                        <button class="segment-btn" data-value="0.5">低</button>
                        <button class="segment-btn" data-value="1.0">标准</button>
                        <button class="segment-btn" data-value="4.0">高清</button>
                        <button class="segment-btn active" data-value="8.0">超清</button>
                    </div>
                    <input type="hidden" id="density-select" value="8.0">
                </div>
                
                <div>
                    <div class="select-wrapper">
                        <select id="render-mode-select" onchange="generateImage()">
                            <option value="hibit" selected>✨ 现代高位 (默认)</option>
                        </select>
                        <svg class="select-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Appearance -->
            <div class="control-section">
                <div class="section-header">
                    <span>外观组件</span>
                    <button class="tool-btn" onclick="randomizeParts()" title="外观随机" style="width: 24px; height: 24px; padding: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
                
                <div class="input-group" style="margin-bottom: 15px;">
                     <div class="label">动作预览 <span style="font-weight:normal;color:#999;font-size:0.7em">(多选 / 最多4个)</span></div>
                     <div id="action-control-container">
                        <!-- JS generated buttons -->
                     </div>
                </div>

                <div class="control-grid" id="parts-grid">
                    <!-- Dynamic Parts Loaded Here -->
                </div>
            </div>

            <!-- Palette -->
            <div class="control-section">
                <div class="section-header">
                    <span>角色配色</span>
                    <button class="tool-btn" onclick="randomizePalette()" title="配色随机" style="width: 24px; height: 24px; padding: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                    </button>
                </div>
                <div class="palette-grid" id="palette-grid">
                    <!-- Dynamic Palette Loaded Here -->
                </div>
            </div>

            <!-- Actions -->
            <div class="action-bar">
                <button id="generate-btn" class="btn btn-primary" onclick="generateImage()">
                    生成角色
                </button>
            </div>
            
            <div style="height: 40px;"></div> <!-- Spacer -->
        </aside>


        <!-- RIGHT STAGE: PREVIEW -->
        <main class="stage">
            <div class="status-toast" id="status-toast">
                <span>✨</span> <span id="toast-msg">就绪</span>
            </div>

            <!-- Grid of Previews -->
            <div class="preview-grid" id="preview-grid-container">
                <!-- Dynamic Items will be injected here -->
                <div class="preview-card-item">
                     <div class="spinner" style="border-color: #ccc; border-top-color: #333; margin: 50px;"></div>
                </div>
            </div>

            <!-- Global Stage Controls -->
            <div class="floating-tools">
                <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-right: 8px;">
                    画布背景
                </div>
                
                <div class="bg-picker-wrapper" style="position: relative; display: flex; align-items: center;">
                    <input type="color" id="stage-bg-picker" value="#e6e6e6" oninput="updateStageBg(this.value)" style="width: 28px; height: 28px; border: none; border-radius: 50%; padding: 0; cursor: pointer; background: none; overflow: hidden;">
                </div>
                
                <button class="tool-btn" onclick="resetBg()" title="自动背景对比度">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path></svg>
                </button>

                <div style="width: 1px; height: 16px; background: var(--border); margin: 0 4px;"></div>

                <div id="stats-display" style="font-size: 0.7rem; color: var(--text-tertiary); font-family: monospace; display: flex; align-items: center;">
                    <!-- Stats injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- JS Logic -->
    <script>
        // --- 汉化字典 (Simplified Translation Map) ---
        const TRANSLATIONS = {
            // Categories
            parts: {
                head: "基础脸型", hair: "发型设计", eyes: "眼神特征", expression: "面部表情", face_wear: "面部饰品",
                body: "上身服饰", legs: "下身/鞋履", back: "背部挂件", held: "手持道具"
            },
            palette: {
                skin: "皮肤色调", hair: "头发颜色", shirt: "上装主色",
                pants: "下装颜色", boots: "鞋履颜色", eye_color: "瞳孔颜色",
                outline: "轮廓线条", metal: "金属光泽", highlight: "高光色",
                gold: "金色", leather: "皮革色", neon_blue: "霓虹蓝",
                brass: "黄铜色", blood: "血色", white: "白色", black: "黑色"
            },

            // Head
            base: "标准萌脸", round_face: "圆润脸型", angular_hero: "英气棱角",

            // Hair
            short_hero: "勇者短发", long_straight: "黑长直", twin_tails: "傲娇双马尾",
            messy_shag: "凌乱碎发", bob: "波波头",
            spiky: "尖刺冲头", long_curly: "波浪卷发", topknot: "武士发髻",
            braided: "编发双辫", bald: "光头",

            // Eyes
            anime_large: "二次元大眼", sharp_focus: "锐利眼神", gentle_droop: "温柔下垂眼",
            cat_eye: "猫瞳",

            // Expression
            neutral: "平静", smile: "微笑", pout: "嘟嘴生气", surprised: "惊讶",

            // Face Wear
            none: "无", glasses_red: "赤框眼镜", bandage: "脸颊创贴", cat_ears_headset: "猫耳耳机",

            // Body
            adventurer_coat: "冒险家外套", school_uniform: "学院制服", maid_dress: "女仆装",
            cyber_vest: "赛博背心", wizard_robe: "魔导长袍",
            tactical_armor: "战术护甲", casual_tee: "休闲T恤", leather_jacket: "皮夹克",
            ball_gown: "华丽礼服",

            // Legs
            pants_boots: "长裤战靴", skirt_socks: "短裙过膝袜", boots_shorts: "短裤皮靴",
            armored_legs: "重甲护腿", armored_greaves: "机械护胫", dress_skirt: "长裙",

            // Held
            sword_iron: "铁剑", staff_magic: "魔法杖", book_spell: "魔导书",
            shield_round: "圆盾", tea_cup: "奶茶",
            plasma_rifle: "等离子枪", buster_sword: "巨剑", katana: "武士刀",
            star_wand: "星之魔杖",

            // Back
            cape_hero: "英雄披风", wings_angel: "天使之翼", backpack_travel: "旅行背包",

            // Themes
            generic: "通用风格", fantasy: "奇幻冒险", scifi: "赛博科幻",
            modern: "现代都市", cute: "Q版萌系", action: "战斗动作",

            // Actions
            idle: "待机呼吸", walk: "行走", attack: "攻击动作", jump: "跳跃",
            run: "奔跑冲刺", hurt: "受击/击退", die: "死亡倒地", cheer: "胜利欢呼",
            attack_shoot: "射击", attack_cast: "施法", attack_heavy: "重击",

            // UI Labels
            generating: "正在生成像素...",
            download_png: "下载超清原图",
            toast_batch: "批量生成完成！"
        };


        function getLabel(category, key) {
            // 1. Try exact match in root (flattened options)
            if (TRANSLATIONS[key]) return TRANSLATIONS[key];
            // 2. Try category specific map
            if (TRANSLATIONS[category] && TRANSLATIONS[category][key]) return TRANSLATIONS[category][key];
            // 3. Fallback: Just return key
            return key;
        }

        // --- State Management ---
        // 默认参数：512px 输出, 8.0 密度 (超清渲染细节)
        // [修改] 默认选中 8 个动作
        let currentConfig = { 
            parts: {}, 
            palette: {}, 
            actions: ["idle", "walk", "run", "attack", "jump", "hurt", "die", "cheer"], 
            render_mode: "hibit",
            density: "8.0",
            output_size: "512" 
        };
        
        let partOptions = {};
        let userManuallySetBg = false;

        // --- Utils ---
        function hexToRgb(hex) {
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            return [r, g, b];
        }

        function rgbToHex(rgb) {
            if (!rgb || !Array.isArray(rgb) || rgb.length < 3) return "#000000";
            return "#" + rgb.map(x => {
                const hex = Math.round(x).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join('');
        }

        function showToast(msg, isError=false) {
            const t = document.getElementById('status-toast');
            const m = document.getElementById('toast-msg');
            m.innerText = msg;
            t.style.color = isError ? 'var(--error)' : 'var(--text-primary)';
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3000);
        }

        // --- Initialization ---
        async function init() {
            try {
                // Initialize Controls based on default state
                document.getElementById('density-select').value = "8.0";
                document.getElementById('output-size-select').value = "512";
                
                // Bind segmented controls manually since we removed old binds
                // setupSegmentedControl('size-control', 'output-size-select');
                // setupSegmentedControl('density-control', 'density-select');

                const optRes = await fetch('/options');
                partOptions = await optRes.json();
                
                const cfgRes = await fetch('/config');
                const loadedConfig = await cfgRes.json();
                
                currentConfig.palette = loadedConfig.palette || {};
                currentConfig.parts = loadedConfig.parts || {};
                
                // Initial Render
                renderControls(); 
                generateImage();
            } catch (e) {
                console.error(e);
                showToast("初始化失败，请检查网络", true);
            }
        }

        function setupSegmentedControl(groupId, inputId) {
            document.querySelectorAll(`#${groupId} .segment-btn`).forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll(`#${groupId} .segment-btn`).forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    document.getElementById(inputId).value = e.target.dataset.value;
                    generateImage();
                });
            });
        }

        // --- Core Logic ---
        async function callRandomize(target = 'all') {
            const theme = document.getElementById('theme-select').value;
            const btn = document.querySelector(`.tool-btn[onclick="randomize${target === 'all' ? 'All' : (target.charAt(0).toUpperCase() + target.slice(1))}"]`);
            if(btn) btn.style.transform = "rotate(360deg)"; 
            
            try {
                const res = await fetch(`/randomize?theme=${theme}`);
                if (!res.ok) throw new Error("Randomize API Error");
                const data = await res.json();
                
                if (target === 'all' || target === 'parts') currentConfig.parts = data.parts;
                if (target === 'all' || target === 'palette') currentConfig.palette = data.palette;
                
                // Update Render Mode if theme changed significantly (only on global random)
                if (target === 'all' && data.render_mode) {
                    const modeSelect = document.getElementById('render-mode-select');
                    modeSelect.value = data.render_mode;
                    currentConfig.render_mode = data.render_mode;
                }

                // Force UI Refresh
                renderControls();
                generateImage();
                
                setTimeout(() => { if(btn) btn.style.transform = "none"; }, 500);
            } catch(e) {
                console.error(e);
                showToast("随机化失败", true);
            }
        }

        function randomizeParts() { callRandomize('parts'); }
        function randomizePalette() { callRandomize('palette'); }
        function randomizeAll() { callRandomize('all'); }

        function updateStageBg(color) {
            userManuallySetBg = true;
            document.querySelectorAll('.pixel-canvas-small').forEach(el => {
                el.style.backgroundColor = color;
            });
        }

        function resetBg() {
            userManuallySetBg = false;
            generateImage(); 
        }

        function toggleActionSelection(actionName) {
            const idx = currentConfig.actions.indexOf(actionName);
            if (idx > -1) {
                if (currentConfig.actions.length > 1) { 
                    currentConfig.actions.splice(idx, 1);
                }
            } else {
                // [Modified] Removed limit < 4
                currentConfig.actions.push(actionName);
            }
            updateActionUI();
            generateImage();
        }

        function updateActionUI() {
            const container = document.getElementById('action-control-container');
            if(!container) return;
            
            container.innerHTML = '';
            const allActions = ["idle", "walk", "run", "attack", "jump", "hurt", "die", "cheer"];
            
            const grid = document.createElement('div');
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            grid.style.gap = '8px';
            
            allActions.forEach(act => {
                if(partOptions.animations && !partOptions.animations.includes(act)) return;
                
                const btn = document.createElement('button');
                const isSelected = currentConfig.actions.includes(act);
                btn.className = isSelected ? 'segment-btn active' : 'segment-btn';
                btn.style.border = '1px solid var(--border)';
                btn.textContent = getLabel('options', act); // 使用中文
                btn.onclick = () => toggleActionSelection(act);
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        }

        function renderControls() {
            // Action UI
            updateActionUI();

            // Parts Grid
            const partsGrid = document.getElementById('parts-grid');
            partsGrid.innerHTML = '';
            for (const [part, styles] of Object.entries(partOptions)) {
                if(part === 'animations' || part === 'themes') continue;
                if(!styles || styles.length === 0) continue; // 自动隐藏空选项
                
                const div = document.createElement('div');
                div.className = 'input-group';
                
                const label = document.createElement('label');
                label.className = 'label';
                label.textContent = getLabel('parts', part);
                
                const wrapper = document.createElement('div');
                wrapper.className = 'select-wrapper';
                
                const select = document.createElement('select');
                styles.forEach(style => {
                    const option = document.createElement('option');
                    option.value = style;
                    option.textContent = getLabel('options', style);
                    select.appendChild(option);
                });
                
                // [Crucial Fix] Ensure the selected value exists in options
                let val = currentConfig.parts[part];
                if (!val || !styles.includes(val)) {
                    val = styles[0];
                    currentConfig.parts[part] = val;
                }
                select.value = val;
                
                select.addEventListener('change', (e) => {
                    currentConfig.parts[part] = e.target.value;
                    generateImage();
                });

                const icon = document.createElement('div');
                icon.innerHTML = '<svg class="select-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>';

                wrapper.appendChild(select);
                wrapper.appendChild(icon.firstChild);
                div.appendChild(label);
                div.appendChild(wrapper);
                partsGrid.appendChild(div);
            }

            // Palette Grid
            const paletteGrid = document.getElementById('palette-grid');
            paletteGrid.innerHTML = '';
            
            const displayKeys = ["skin", "hair", "shirt", "pants", "boots", "eye_color", "metal"];
            
            for (const key of displayKeys) {
                const value = currentConfig.palette[key];
                if (!value || !Array.isArray(value) || value.length < 3) continue;
                
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'center';

                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = rgbToHex(value);
                
                const input = document.createElement('input');
                input.type = 'color';
                input.value = rgbToHex(value);
                input.addEventListener('input', (e) => {
                    swatch.style.backgroundColor = e.target.value;
                });
                input.addEventListener('change', (e) => {
                    currentConfig.palette[key] = hexToRgb(e.target.value);
                    generateImage();
                });
                
                swatch.appendChild(input);
                
                const label = document.createElement('span');
                label.className = 'swatch-label';
                label.textContent = getLabel('palette', key);
                
                div.appendChild(swatch);
                div.appendChild(label);
                paletteGrid.appendChild(div);
            }
        }


        async function generateImage() {
            const btn = document.getElementById('generate-btn');
            const grid = document.getElementById('preview-grid-container');
            const stats = document.getElementById('stats-display');
            
            const density = document.getElementById('density-select').value;
            const outputSize = document.getElementById('output-size-select').value;
            const mode = document.getElementById('render-mode-select').value;
            
            currentConfig.density = density;
            currentConfig.output_size = outputSize;
            currentConfig.render_mode = mode;

            // Loading State
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<div class="spinner"></div> ${TRANSLATIONS.generating}`;
            btn.disabled = true;
            grid.style.opacity = 0.6;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentConfig)
                });

                const data = await response.json();
                
                if (response.ok && data.results) {
                    grid.innerHTML = ''; 
                    
                    // Auto Contrast Background Calculation
                    let autoBg = "#f0f2f5";
                    if (!userManuallySetBg) {
                        const p = currentConfig.palette;
                        if(p && p.skin) {
                            const luma = (p.skin[0] * 0.299 + p.skin[1] * 0.587 + p.skin[2] * 0.114);
                            autoBg = luma > 150 ? "#2d3436" : "#f0f2f5";
                            const picker = document.getElementById('stage-bg-picker');
                            if(picker) picker.value = (autoBg === "#f0f2f5" ? "#f0f2f5" : "#2d3436");
                        }
                    } else {
                         const picker = document.getElementById('stage-bg-picker');
                         if(picker) autoBg = picker.value;
                    }

                    // Render Grid Items
                    // [修改] 强制按照 currentConfig.actions 的顺序渲染，确保预览顺序固定
                    currentConfig.actions.forEach(act => {
                        const item = data.results[act];
                        if (!item) return; // 防御性检查
                        
                        const card = document.createElement('div');
                        card.className = 'preview-card-item';
                        
                        const header = document.createElement('div');
                        header.className = 'preview-header';
                        // 使用中文 Action Name
                        header.innerHTML = `<span>${getLabel('options', act)}</span> <span style="font-weight:400; font-size:0.7rem">${item.size_kb}KB</span>`;
                        
                        const img = document.createElement('img');
                        img.className = 'pixel-canvas-small';
                        img.src = item.image;
                        img.style.backgroundColor = autoBg;
                        
                        const dlBtn = document.createElement('a');
                        dlBtn.className = 'mini-btn';
                        dlBtn.href = item.download_data;
                        dlBtn.download = item.filename;
                        dlBtn.innerHTML = TRANSLATIONS.download_png;
                        dlBtn.style.width = '100%';
                        dlBtn.style.textAlign = 'center';
                        
                        card.appendChild(header);
                        card.appendChild(img);
                        card.appendChild(dlBtn);
                        grid.appendChild(card);
                    });
                    
                    grid.style.opacity = 1;

                    if (data.stats) {
                        stats.innerText = `生成耗时: ${data.stats.duration}s | 总大小: ${data.stats.total_size_kb}KB`;
                        showToast(TRANSLATIONS.toast_batch);
                    }
                } else {
                    showToast("错误: " + (data.error || "未知错误"), true);
                }
            } catch (e) {
                console.error(e);
                showToast("网络连接错误", true);
            } finally {
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
