# Character Template Configuration
canvas:
  width: 32
  height: 32

# 角色外观部件选择（使用样式名称，不是坐标）
parts:
  head: human
  hair: short
  eyes: normal
  body: shirt
  legs: pants
  back: none
  held: none

# 配色方案
palette:
  skin: [255, 200, 150]
  hair: [100, 50, 0]
  shirt: [0, 100, 255]
  pants: [50, 50, 50]
  boots: [100, 50, 0]
  outline: [20, 20, 20]
  eye_color: [50, 50, 50]
